<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حذف موظف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow" style="max-width: 500px; margin: auto;">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">تأكيد الحذف</h4>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">هل أنت متأكد من حذف الموظف؟</p>
            <h4 class="text-danger">{{ employee.name }}</h4>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <a href="{% url 'employee_list' %}" class="btn btn-secondary me-2">إلغاء</a>
                <button type="submit" class="btn btn-danger">نعم، احذف</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
