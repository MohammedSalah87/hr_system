<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow" style="max-width: 700px; margin: auto;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">{{ title }}</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>الاسم</label>
                        {{ form.name }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>البريد الإلكتروني</label>
                        {{ form.email }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>الهاتف</label>
                        {{ form.phone }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>القسم</label>
                        {{ form.department }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>المنصب</label>
                        {{ form.position }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>الراتب</label>
                        {{ form.salary }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>تاريخ التعيين</label>
                        {{ form.hire_date }}
                    </div>
<div class="col-md-6 mb-3">
    <label>الشفت</label>
    {{ form.shift }}
</div>
                    <div class="col-md-6 mb-3 mt-4">
                        <div class="form-check">
                            {{ form.is_active }}
                            <label class="form-check-label">موظف نشط</label>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <a href="{% url 'employee_list' %}" class="btn btn-secondary">رجوع</a>
                    <button type="submit" class="btn btn-primary">حفظ</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
