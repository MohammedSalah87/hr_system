<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة ترقية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #1e3a5f;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .sidebar a:hover { background: #2d5a8e; }
    </style>
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar p-3" style="width: 230px;">
        <h5 class="text-white text-center mb-4">🏢 نظام HR</h5>
        <a href="{% url 'dashboard' %}"><i class="bi bi-speedometer2 me-2"></i> لوحة التحكم</a>
        <a href="{% url 'employee_list' %}"><i class="bi bi-people me-2"></i> الموظفين</a>
        <a href="{% url 'attendance_list' %}"><i class="bi bi-calendar-check me-2"></i> الحضور</a>
        <a href="{% url 'shift_list' %}"><i class="bi bi-clock me-2"></i> الشفتات</a>
        <a href="{% url 'payroll_list' %}"><i class="bi bi-cash-stack me-2"></i> الرواتب</a>
        <a href="{% url 'work_settings' %}"><i class="bi bi-gear me-2"></i> الإعدادات</a>
        <a href="{% url 'logout' %}" style="position: absolute; bottom: 20px;">
            <i class="bi bi-box-arrow-left me-2"></i> تسجيل الخروج
        </a>
    </div>

    <div class="flex-grow-1 p-4">
        <h3 class="mb-4">📈 إضافة ترقية — {{ employee.name }}</h3>

        <div class="card shadow border-0" style="max-width: 600px;">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">بيانات الترقية</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>المنصب الحالي</label>
                            <input type="text" class="form-control" value="{{ employee.position }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>الراتب الحالي</label>
                            <input type="text" class="form-control" value="{{ employee.salary }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>المنصب الجديد</label>
                            <input type="text" name="new_position" class="form-control" 
                                   placeholder="المنصب الجديد" value="{{ employee.position }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>الراتب الجديد</label>
                            <input type="number" name="new_salary" class="form-control" 
                                   placeholder="الراتب الجديد" value="{{ employee.salary }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>تاريخ الترقية</label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label>ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="3" 
                                      placeholder="سبب الترقية أو ملاحظات إضافية"></textarea>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'promotion_list' employee.pk %}" class="btn btn-secondary">رجوع</a>
                        <button type="submit" class="btn btn-primary">💾 حفظ الترقية</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
