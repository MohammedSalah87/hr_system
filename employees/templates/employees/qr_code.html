<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>QR Code - {{ employee.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <div class="card shadow mx-auto" style="max-width: 400px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">QR Code للحضور</h4>
        </div>
        <div class="card-body">
            <h5 class="mb-3">{{ employee.name }}</h5>
            <p class="text-muted">{{ employee.department }} - {{ employee.position }}</p>
            <img src="data:image/png;base64,{{ qr_image }}" class="img-fluid mb-3" style="max-width: 250px;">
            <p class="text-muted small">الموظف يمسح هذا الكود بالجوال لتسجيل حضوره</p>
            <a href="{% url 'employee_list' %}" class="btn btn-secondary mt-2">رجوع</a>
        </div>
    </div>
</div>
</body>
</html>
