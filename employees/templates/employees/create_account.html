<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #1e3a5f;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .sidebar a:hover { background: #2d5a8e; }
    </style>
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar p-3" style="width: 230px;">
        <h5 class="text-white text-center mb-4">🏢 نظام HR</h5>
        <a href="{% url 'dashboard' %}"><i class="bi bi-speedometer2 me-2"></i> لوحة التحكم</a>
        <a href="{% url 'employee_list' %}"><i class="bi bi-people me-2"></i> الموظفين</a>
        <a href="{% url 'logout' %}" style="position: absolute; bottom: 20px;">
            <i class="bi bi-box-arrow-left me-2"></i> تسجيل الخروج
        </a>
    </div>

    <div class="flex-grow-1 p-4">
        <h3 class="mb-4">👤 إنشاء حساب — {{ employee.name }}</h3>

        <div class="card shadow border-0" style="max-width: 500px;">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">بيانات الحساب</h5>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                {% if employee.user %}
                <div class="alert alert-info">
                    ✅ هذا الموظف عنده حساب مسبقاً — اسم المستخدم: <strong>{{ employee.user.username }}</strong>
                </div>
                <a href="{% url 'employee_list' %}" class="btn btn-secondary">رجوع</a>
                {% else %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" 
                               placeholder="مثال: ahmed123" required>
                    </div>
                    <div class="mb-3">
                        <label>كلمة المرور</label>
                        <input type="password" name="password" class="form-control" 
                               placeholder="كلمة المرور" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'employee_list' %}" class="btn btn-secondary">رجوع</a>
                        <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
                    </div>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
