<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a5f, #2d5a8e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 400px;
        }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <h2>🏢 نظام HR</h2>
            <p class="text-muted">سجّل دخولك للمتابعة</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label>اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <label>كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="كلمة المرور" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger">اسم المستخدم أو كلمة المرور غلط</div>
            {% endif %}
            <button type="submit" class="btn btn-primary w-100 mt-2">دخول</button>
        </form>
    </div>
</body>
</html>
